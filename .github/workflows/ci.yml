name: CI-пайплайн для Flask-приложения

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v3
      
      - name: Устанавливаем Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      
      - name: Устанавливаем зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Запускаем тесты
        run: |
          python -m pytest -v
      
      # === НОВЫЕ ШАГИ: Docker ===
      
      - name: Логинимся в Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Собираем и публикуем Docker-образ
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd-project:latest